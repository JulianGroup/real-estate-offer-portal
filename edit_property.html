<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Listing - Real Estate Offer Portal</title>
    <link rel="stylesheet" href="styles.css">
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBTzxAQ40a9bwHZLmkyWbQQYTSejT-SQ90&libraries=places"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">Offer<span>Portal</span></div>
            <div>
                <a href="index.html" class="btn btn-outline" style="margin-right: 1rem;">Dashboard</a>
            </div>
        </div>
    </nav>

    <header class="page-header" style="padding: 2rem 0; margin-bottom: 2rem;">
        <div class="container">
            <h1>Edit Property Listing</h1>
            <p id="edit-property-subtitle">Update details for the selected property.</p>
        </div>
    </header>

    <main class="container" style="max-width: 800px; padding-bottom: 4rem;">
        <div class="card">
            <form id="edit-property-form">
                <div class="form-group">
                    <label class="form-label">Property Address</label>
                    <input type="text" id="edit-address" class="form-control" placeholder="Loading..." required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Asking Price</label>
                    <input type="text" id="edit-price" class="form-control currency-input" placeholder="Loading..." required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Listing Status</label>
                    <select id="edit-status" class="form-control" required>
                        <option value="Active Listing">Active Listing</option>
                        <option value="Hold">Hold</option>
                        <option value="Trash">Trash</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Property Description</label>
                    <textarea id="edit-desc" class="form-control" rows="4" placeholder="Loading..."></textarea>
                </div>
                
                <div class="form-group" style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border);">
                    <h3>Owner Details</h3>
                    <p class="text-muted mb-4">Internal use only. Not shown to buyers.</p>
                    
                    <div style="margin-bottom: 1rem;">
                        <label class="form-label">Owner Name</label>
                        <input type="text" id="edit-owner-name" class="form-control" placeholder="Loading...">
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label class="form-label">Owner Email</label>
                            <input type="email" id="edit-owner-email" class="form-control" placeholder="Loading...">
                        </div>
                        <div>
                            <label class="form-label">Owner Mobile</label>
                            <input type="tel" id="edit-owner-mobile" class="form-control phone-input" placeholder="Loading..." minlength="14" maxlength="14">
                        </div>
                    </div>
                    
                    <div style="margin-top: 1rem;">
                        <label class="form-label">Listing Commission (%)</label>
                        <input type="number" id="edit-listing-commission" class="form-control" placeholder="e.g. 5.00" step="0.01" min="0" max="100">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Property Photo</label>
                    <div style="margin-bottom: 1rem; border-radius: var(--radius-md); overflow: hidden; height: 200px;">
                        <img id="edit-property-image-preview" src="https://images.unsplash.com/photo-1518780664697-55e3ad937233?auto=format&fit=crop&w=800&q=80" alt="Property" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <label for="edit-image" class="file-upload-area" style="cursor: pointer; display: block; text-align: center; padding: 1rem;">
                        <p id="edit-image-text" style="margin: 0;">Click to select a new property image (.jpg, .png)</p>
                        <input type="file" id="edit-image" accept="image/*" style="display: none;" onchange="document.getElementById('edit-image-text').innerText = this.files[0] ? '✅ ' + this.files[0].name : 'Click to select a new property image (.jpg, .png)'">
                    </label>
                </div>

                <div class="form-group" style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border);">
                    <h3>Lender Partner</h3>
                    <select class="form-control mb-4">
                        <option selected>Rakesh Jain (Default)</option>
                        <option>Other / Paid Placement</option>
                    </select>
                </div>
                
                <div class="flex justify-between mt-4">
                    <a href="index.html" class="btn btn-outline">Cancel</a>
                    <button type="submit" id="btn-edit-property" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </main>
    <script type="module" src="app.js?v=20"></script>
</body>
</html>
