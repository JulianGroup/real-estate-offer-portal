<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Login - Real Estate Offer Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background-image: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);">
    
    <div class="card" style="width: 100%; max-width: 400px; margin: 0 1rem;">
        <div class="text-center mb-6">
            <div class="logo" style="justify-content: center; font-size: 2rem; margin-bottom: 1rem;">Offer<span>Portal</span></div>
            <h1 style="color: var(--text-main); font-size: 1.5rem;">Welcome Back</h1>
            <p class="text-muted">Log in to manage your property portals.</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="login-email" class="form-control" placeholder="jane@example.com" required>
            </div>
            
            <div class="form-group" style="margin-bottom: 0.5rem;">
                <label class="form-label">Password</label>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <div style="text-align: right; margin-bottom: 1.5rem;">
                <a href="#" id="btn-forgot-password" style="font-size: 0.85rem; color: var(--primary);">Forgot Password?</a>
            </div>

            <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%;">Log In</button>
            
            <div class="text-center mt-4">
                <p class="text-muted">Need an account? <a href="register.html" style="font-weight: 500;">Register here</a></p>
            </div>
        </form>
    </div>

    <script type="module" src="app.js?v=9"></script>
</body>
</html>
