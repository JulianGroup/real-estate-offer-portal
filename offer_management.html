<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Management - 123 Maple Street</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">Offer<span>Portal</span></div>
            <div>
                <a href="index.html" class="btn btn-outline" style="margin-right: 1rem;">Dashboard</a>
            </div>
        </div>
    </nav>

    <header class="page-header" style="padding: 2rem 0; margin-bottom: 2rem;">
        <div class="container flex justify-between items-center">
            <div>
                <h1 id="prop-address-header">Loading Property...</h1>
                <p>Manage and compare all offers received for this property.</p>
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <button id="btn-email-seller" class="btn btn-secondary">Email Offers to Seller</button>
                <button id="btn-text-seller" class="btn btn-secondary">Text link to seller</button>
                <button id="btn-copy-seller-link" class="btn btn-secondary">Copy Link</button>
            </div>
        </div>
    </header>

    <main class="container" style="padding-bottom: 4rem;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;" class="mb-4">
            <h2 id="offers-count-header" style="margin: 0;">Received Offers (0)</h2>
            <div class="view-toggle" style="margin-bottom: 0;">
                <button class="view-toggle-btn active" id="btn-card-view">Card View</button>
                <button class="view-toggle-btn" id="btn-grid-view">Grid View</button>
            </div>
        </div>
        
        <div id="offers-container" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <!-- Offers will be dynamically injected here -->
            <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; background: var(--surface); border-radius: var(--radius-md);">
                <p class="text-muted">Loading offers...</p>
            </div>
        </div>

        <div id="offers-grid-container" class="table-responsive" style="display: none; margin-top: 0;">
            <!-- Grid table will be dynamically injected here -->
        </div>
    </main>
    <script type="module" src="app.js?v=31"></script>
</body>
</html>
